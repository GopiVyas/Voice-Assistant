<!DOCTYPE html>
<html>
<head>
  <title>🎙️ Voice Assistant</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: linear-gradient(to right, #0072ff, #00c6ff);
      color: white;
      padding-top: 100px;
    }
    button {
      background-color: white;
      color: #0072ff;
      border: none;
      padding: 15px 30px;
      border-radius: 8px;
      font-size: 18px;
      cursor: pointer;
    }
    button:hover {
      background-color: #0072ff;
      color: white;
    }
    h1 {
      font-size: 36px;
    }
    .response {
      margin-top: 30px;
      font-size: 20px;
    }
  </style>
</head>
<body>
  <h1>🧠 Smart Voice Assistant</h1>

  <form action="/" method="POST" id="voiceForm">
    <input type="hidden" name="command" id="commandInput">
    <button type="button" onclick="startListening()">🎤 Speak Now</button>
  </form>

  <div class="response">
    <p>{{ response }}</p>
  </div>

  <script>
    function startListening() {
      if (!('webkitSpeechRecognition' in window)) {
        alert("Your browser doesn't support speech recognition. Try Chrome!");
        return;
      }

      const recognition = new webkitSpeechRecognition();
      recognition.lang = "en-IN";
      recognition.start();

      recognition.onresult = function(event) {
        const transcript = event.results[0][0].transcript;
        document.getElementById("commandInput").value = transcript;
        document.getElementById("voiceForm").submit();
      };

      recognition.onerror = function() {
        alert("Sorry, I couldn't hear you properly. Please try again.");
      };
    }
  </script>
</body>
</html>
